<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Text Summarizer</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            margin-top: 40px;
            max-width: 800px;
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border-radius: 10px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
        }

        .btn-custom {
            width: 100%;
            margin-top: 10px;
        }

        .result {
            margin-top: 20px;
            background: #16a34a;
            padding: 15px;
            border-radius: 10px;
        }

        .error {
            margin-top: 20px;
            background: #dc2626;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 class="text-center">🧠 Text Summarizer</h2>
    <p class="text-center">Enter text and get AI summary</p>

    <!-- FORM -->
    <form action="/" method="POST">

        <label>Enter Text:</label>
        <textarea name="input_text" required>{{ original_text }}</textarea>

        <label class="mt-3">Number of Sentences:</label>
        <input type="number" name="num_sentences" min="1" max="10" required>

        <button type="submit" class="btn btn-primary btn-custom">
            Generate Summary
        </button>
    </form>

    <!-- ERROR -->
    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <!-- SUMMARY -->
    {% if output_summary %}
    <div class="result">
        <h5>Summary:</h5>
        <p>{{ output_summary }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
